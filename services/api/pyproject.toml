[project]
name = "galeiria-api"
version = "0.2.0"
description = "Local API and library indexer for Galeiria"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pillow>=11,<12",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1"
]

[project.scripts]
galeiria-api = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
